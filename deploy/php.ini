; Production settings for every PHP process in the image: the FrankenPHP threads (worker or
; classic mode), and the CLI processes bin/start runs beside them (bin/cable, queue:work).

[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 30
upload_max_filesize = 100M
post_max_size = 105M
max_file_uploads = 50
; Errors go to stderr (docker logs), never into responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.auto_start = Off
zend.assertions = -1

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
; CLI processes are long-running (cable, queue) and compile each file once anyway.
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
; The code is baked into the image and never changes at runtime (compiled Blade views are
; written once, by `view:cache` in bin/start, before FrankenPHP starts).
opcache.validate_timestamps = 0
opcache.enable_file_override = 1
